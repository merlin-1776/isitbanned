name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Mark build for deployment verification
        run: printf '\n<!-- deployment-commit:%s -->\n' "$GITHUB_SHA" >> dist/index.html
      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=isitbanned --branch=main
      - name: Verify production freshness
        shell: bash
        run: |
          set -euo pipefail
          for base in https://isitbanned.pages.dev https://isitbanned.com; do
            ok=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$base/?deployment-check=$GITHUB_SHA" | grep -Fq "deployment-commit:$GITHUB_SHA"; then
                ok=true
                break
              fi
              sleep 10
            done
            if [ "$ok" != true ]; then
              echo "Production freshness check failed for $base" >&2
              exit 1
            fi
          done
